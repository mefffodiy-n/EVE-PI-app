name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - run: pip install -r requirements-dev.lock.txt pip-audit
      - run: pip-audit -r requirements.lock.txt --no-deps --disable-pip
      - run: ruff check .
      - run: mypy
      - run: python -m scripts.extract_schematics --write
      - run: python -m pytest tests/ -q --cov --cov-report=term
