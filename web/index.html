<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EVE PI Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');
        
        :root {
            --bg-main: #060a14; --bg-panel: rgba(11, 17, 26, 0.75); --bg-input: #03050a;
            --border-color: #1a2639; --text-main: #8a9bb3; --text-heading: #38bdf8;
            --text-white: #ffffff; --accent: #38bdf8; --accent-hover: rgba(56, 189, 248, 0.05);
            --bg-header: #0b111a;
        }

        .light-theme {
            --bg-main: #f1f5f9; --bg-panel: rgba(255, 255, 255, 0.95); --bg-input: #f8fafc;
            --border-color: #cbd5e1; --text-main: #475569; --text-heading: #0284c7;
            --text-white: #0f172a; --accent: #0284c7; --accent-hover: rgba(2, 132, 199, 0.05);
            --bg-header: #e2e8f0;
        }

        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-main); color: var(--text-main); letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.3s; }
        .font-mono-eve { font-family: 'Share Tech Mono', monospace; }
        .text-white-dynamic { color: var(--text-white); }
        .bg-header-dynamic { background-color: var(--bg-header); border-color: var(--border-color); }
        .border-dynamic { border-color: var(--border-color); }

        .eve-panel { background-color: var(--bg-panel); border: 1px solid var(--border-color); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding: 8px 12px; }
        .panel-header h2 { color: var(--text-heading); font-size: 13px; font-weight: 600; }

        .eve-input { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-white); font-family: 'Share Tech Mono', monospace; font-size: 13px; width: 100%; padding: 8px 12px; outline: none; transition: all 0.3s; }
        .eve-input:focus { border-color: var(--accent); }

        .eve-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); width: 100%; padding: 10px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; }
        .eve-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-hover); }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: var(--bg-input); }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-header-dynamic border-b p-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-3 h-3 rounded-full bg-[#38bdf8]"></div>
            <h1 class="text-lg font-bold text-white-dynamic tracking-widest">PI DIRECTOR</h1>
        </div>
        <div class="flex items-center gap-6 font-mono-eve text-xs">
            <button onclick="toggleTheme()" class="hover:text-[var(--accent)]">[ 🌓 THEME ]</button>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 bg-[#4ade80] rounded-full shadow-[0_0_8px_#4ade80]"></span>
                <span class="text-[#4ade80] font-bold tracking-widest">OPERATIONAL</span>
            </div>
        </div>
    </header>

    <div class="flex-1 p-4 grid grid-cols-1 md:grid-cols-12 gap-4">
        <!-- LEFT COLUMN -->
        <div class="col-span-3 flex flex-col gap-4">
            <div class="eve-panel">
                <div class="panel-header"><h2>ДОСТУП</h2></div>
                <div class="p-4" id="authContainer">
                    <button onclick="loginSSO()" class="eve-btn border-[#0f4a73] text-[var(--accent)] mb-3">
                        <span>ВОЙТИ ЧЕРЕЗ EVE SSO</span>
                    </button>
                </div>
            </div>

            <div class="eve-panel">
                <div class="panel-header"><h2>MARKET INTELLIGENCE</h2></div>
                <div class="p-4">
                    <button onclick="analyzeMarket(event)" class="eve-btn mb-3 border-[var(--accent)] text-[var(--accent)]">
                        <span>АЛГОРИТМ ОЦЕНКИ ВЫГОДЫ</span>
                    </button>
                    <div id="marketResults" class="hidden">
                        <div id="bestProductLabel" class="text-white-dynamic font-bold tracking-wider mb-3 bg-[var(--accent-hover)] p-2 border border-[var(--accent)] text-[10px]"></div>
                        <div id="marketTable" class="space-y-1 max-h-32 overflow-y-auto pr-1 custom-scroll"></div>
                    </div>
                </div>
            </div>

            <div class="eve-panel">
                <div class="panel-header"><h2>ПАРАМЕТРЫ ЛОГИСТИКИ</h2></div>
                <div class="p-4 space-y-4">
                    <div>
                        <label class="block text-[10px] mb-1">Домашнее созвездие</label>
                        <select id="baseSelect" class="eve-input"><option value="ALL">-- ВЕСЬ РЕГИОН --</option></select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[var(--accent)] mb-1 font-bold">Система сборки (P2-P4)</label>
                        <select id="factorySystem" class="eve-input"><option value="">-- ВЫБЕРИТЕ СИСТЕМУ --</option></select>
                    </div>
                    <div>
                        <label class="block text-[10px] mb-1 text-[var(--accent)]">Целевые продукты (Мультивыбор)</label>
                        <div class="relative" id="customProdDropdown">
                            <div id="customProdHeader" class="eve-input flex items-center justify-between cursor-pointer w-full hover:border-[var(--accent)] overflow-hidden">
                                <div id="prodSelectedText" class="flex flex-wrap items-center gap-1 overflow-hidden h-6 text-white-dynamic font-mono-eve text-[12px] whitespace-nowrap text-ellipsis">
                                    Выберите продукты...
                                </div>
                                <span class="text-[10px] text-[var(--accent)] ml-2">▼</span>
                            </div>
                            <div id="customProdOptions" class="absolute z-50 w-full bg-[var(--bg-panel)] border border-[var(--border-color)] mt-1 hidden max-h-60 overflow-y-auto shadow-[0_4px_15px_rgba(0,0,0,0.5)] backdrop-blur-md custom-scroll">
                            </div>
                        </div>
                    </div>
                    <button onclick="calculate()" class="eve-btn mt-2"><span>СГЕНЕРИРОВАТЬ ПЛАН</span></button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="col-span-9 flex flex-col gap-4">
            <div id="resultBox" class="eve-panel flex-1 flex flex-col">
                <div class="panel-header"><h2>РАСПРЕДЕЛЕНИЕ ПЕРСОНАЖЕЙ</h2></div>
                <div id="setupContent" class="p-4 space-y-2">
                    <div class="flex items-center justify-center py-20 border border-dashed border-dynamic text-sm">ОЖИДАНИЕ ВВОДА ПАРАМЕТРОВ...</div>
                </div>
                <div class="border-t border-dynamic p-3 flex justify-between items-center bg-[var(--bg-input)] mt-auto">
                    <span class="font-mono-eve text-[10px] text-[#4ade80]" id="logStatus">SYS · READY</span>
                    <button onclick="exportExcel()" class="font-mono-eve text-[11px] hover:text-[var(--accent)] px-4 py-1 border border-dynamic">[ EXPORT TO EXCEL ]</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentPlan = null;
        let globalProductIds = {};
        let selectedProducts = [];
        let allProductsList = [];

        function toggleTheme() { document.body.classList.toggle('light-theme'); }

        async function init() {
            let token = localStorage.getItem('eve_token');
            if (token) renderAuthUser();

            try {
                let response = await fetch(`${API_BASE}/initial-data`);
                let res = await response.json();
                
                let baseSel = document.getElementById('baseSelect');
                globalProductIds = res.product_ids;
                allProductsList = res.products;
                
                res.bases.forEach(b => baseSel.innerHTML += `<option value="${b}">${b}</option>`);
                
                baseSel.addEventListener('change', async (e) => {
                    let sysSel = document.getElementById('factorySystem');
                    sysSel.innerHTML = `<option value="">-- ВЫБЕРИТЕ СИСТЕМУ --</option>`;
                    let sysRes = await fetch(`${API_BASE}/systems/${e.target.value}`);
                    let sysData = await sysRes.json();
                    sysData.systems.forEach(s => sysSel.innerHTML += `<option value="${s}">${s}</option>`);
                });

                renderDropdownList();
                baseSel.dispatchEvent(new Event('change'));
            } catch (error) { console.error(error); }
        }

        function renderDropdownList() {
            let html = '';
            allProductsList.forEach(p => {
                let tid = globalProductIds[p];
                let isSel = selectedProducts.includes(p);
                let iconHtml = tid ? `<img src="https://images.evetech.net/types/${tid}/icon?size=64" class="w-6 h-6 rounded border border-dynamic shrink-0 bg-[#00000080]">` : '';
                let bgClass = isSel ? 'bg-[var(--accent-hover)] border-l-2 border-[var(--accent)]' : 'border-l-2 border-transparent';
                
                html += `
                    <div class="flex items-center gap-3 p-2 hover:bg-[var(--accent-hover)] cursor-pointer border-b border-dynamic last:border-none transition-colors ${bgClass}"
                         onclick="toggleProduct('${p}', event)">
                        <div class="w-3 h-3 border border-dynamic flex items-center justify-center shrink-0">
                            ${isSel ? '<div class="w-2 h-2 bg-[var(--accent)]"></div>' : ''}
                        </div>
                        ${iconHtml}
                        <span class="text-white-dynamic font-mono-eve text-[12px]">${p}</span>
                    </div>
                `;
            });
            document.getElementById('customProdOptions').innerHTML = html;
            
            let textEl = document.getElementById('prodSelectedText');
            if(selectedProducts.length === 0) {
                textEl.innerHTML = 'Выберите продукты...';
            } else {
                let textHtml = '';
                selectedProducts.forEach(p => {
                    let tid = globalProductIds[p];
                    if(tid) textHtml += `<img src="https://images.evetech.net/types/${tid}/icon?size=64" class="w-5 h-5 rounded border border-dynamic shrink-0 bg-[#00000080]" title="${p}">`;
                });
                textHtml += `<span class="ml-2">Выбрано: ${selectedProducts.length}</span>`;
                textEl.innerHTML = textHtml;
            }
        }

        window.toggleProduct = function(prodName, event) {
            if(event) event.stopPropagation();
            let idx = selectedProducts.indexOf(prodName);
            if(idx > -1) selectedProducts.splice(idx, 1);
            else selectedProducts.push(prodName);
            renderDropdownList();
        }

        document.getElementById('customProdHeader').addEventListener('click', (e) => {
            e.stopPropagation(); document.getElementById('customProdOptions').classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
            if (!document.getElementById('customProdDropdown').contains(e.target)) {
                document.getElementById('customProdOptions').classList.add('hidden');
            }
        });

        async function loginSSO() {
            let callRes = await fetch(`${API_BASE}/auth/callback?code=mock_code`);
            let authData = await callRes.json();
            if(authData.status === "success") {
                localStorage.setItem('eve_token', 'mock_jwt');
                localStorage.setItem('eve_chars', JSON.stringify(authData.characters));
                renderAuthUser();
            }
        }

        function renderAuthUser() {
            let charsStr = localStorage.getItem('eve_chars');
            if(!charsStr) return;
            let chars = JSON.parse(charsStr);
            let container = document.getElementById('authContainer');
            let html = `<div class="space-y-2 max-h-40 overflow-y-auto pr-1 custom-scroll">`;
            chars.forEach(c => {
                let roleColor = c.ccu === 5 ? "text-[var(--accent)]" : "text-[var(--text-main)]";
                let avatarUrl = `https://images.evetech.net/characters/${c.character_id > 100000 ? c.character_id : 1}/portrait?size=64`;
                html += `
                <div class="flex items-center gap-3 bg-[var(--bg-input)] border border-dynamic p-2 hover:border-[var(--accent)] transition-colors">
                    <img src="${avatarUrl}" class="w-8 h-8 rounded-full border border-[var(--border-color)]">
                    <div class="flex-1 flex justify-between items-center">
                        <span class="text-white-dynamic font-bold text-[11px] tracking-wider">${c.name}</span>
                        <span class="${roleColor} text-[10px] font-mono-eve">${c.ccu === 5 ? 'FACTORY' : 'MINING'}</span>
                    </div>
                </div>`;
            });
            html += `</div><button onclick="localStorage.clear(); location.reload();" class="mt-4 font-mono-eve text-[10px] text-[#ef4444] w-full text-right">[ LOGOUT ]</button>`;
            container.innerHTML = html;
        }

        async function analyzeMarket(event) {
            let btn = event.currentTarget; let original = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">SYNCING...</span>';
            try {
                let response = await fetch(`${API_BASE}/market/best-product`);
                let res = await response.json();
                if(res.status === "success") {
                    document.getElementById('marketResults').classList.remove('hidden');
                    document.getElementById('bestProductLabel').innerText = "РЕКОМЕНДОВАНО: " + res.recommended.toUpperCase();
                    selectedProducts = [res.recommended];
                    renderDropdownList();
                    
                    let html = '';
                    res.analytics.forEach((item, i) => {
                        html += `<div class="flex justify-between text-[11px] font-mono-eve border-b border-dynamic pb-1">
                            <span class="${i === 0 ? 'text-[#4ade80]' : ''}">${item.product}</span>
                            <span class="text-white-dynamic">${item.jita_buy.toLocaleString('ru-RU')} ISK</span>
                        </div>`;
                    });
                    document.getElementById('marketTable').innerHTML = html;
                }
            } catch (error) {} finally { btn.innerHTML = original; }
        }

        async function calculate() {
            let base = document.getElementById('baseSelect').value;
            let sys = document.getElementById('factorySystem').value;
            if(!sys) return alert("Выберите систему сборки");
            if(selectedProducts.length === 0) return alert("Выберите хотя бы один продукт");
            
            document.getElementById('setupContent').innerHTML = '<div class="text-[var(--accent)] p-4 font-mono-eve animate-pulse">CALCULATING CAPACITIES...</div>';
            
            let response = await fetch(`${API_BASE}/calculate`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ constellation: base, factory_sys: sys, target_products: selectedProducts })
            });
            let res = await response.json();
            
            if(res.status === "success") {
                currentPlan = res.data;
                let html = '';
                if (res.warning) {
                    html += `<div class="bg-[#ef4444] bg-opacity-10 border border-[#ef4444] text-[#ef4444] p-3 text-[11px] font-bold mb-4 flex gap-3"><span class="animate-ping">!</span> <span>${res.warning}</span></div>`;
                }
                res.data.forEach(p => {
                    let pgBar = p.pg_load > 100 ? "bg-[#ef4444]" : "bg-[#f59e0b]";
                    let charAvatar = `https://images.evetech.net/characters/${p.char_id > 100000 ? p.char_id : 1}/portrait?size=64`;
                    let prodIcon = p.type_id ? `https://images.evetech.net/types/${p.type_id}/icon?size=64` : '';
                    let roleStyle = p.role.includes("Избыток") ? "text-[#f59e0b]" : "text-[var(--text-main)]";

                    html += `
                    <div class="bg-[var(--bg-input)] border ${p.pg_load > 100 ? 'border-[#ef4444]' : 'border-dynamic'} p-3 flex flex-col gap-2 mb-2">
                        <div class="flex justify-between items-start">
                            <div class="w-1/3 flex items-start gap-2">
                                <img src="${charAvatar}" class="w-8 h-8 rounded-full border border-dynamic shrink-0">
                                <div><span class="text-white-dynamic font-bold text-[11px]">${p.character}</span><br><span class="text-[10px] ${roleStyle}">${p.role}</span></div>
                            </div>
                            <div class="w-1/3 text-center text-[11px]">${p.system}<br><span class="text-[9px] text-[var(--accent)]">${p.planet}</span></div>
                            <div class="w-1/3 flex items-start justify-end gap-2 text-right font-mono-eve text-[10px]">
                                <div>IN: ${p.res_in}<br>OUT: <span class="font-bold text-[var(--accent)]">${p.res_out}</span><br><span class="text-[9px] text-gray-500">${p.structures}</span></div>
                                ${prodIcon ? `<img src="${prodIcon}" class="w-8 h-8 rounded border border-dynamic shrink-0 bg-[#00000080]">` : ''}
                            </div>
                        </div>
                        <div class="flex gap-4 items-center bg-[var(--bg-panel)] p-1 border border-dynamic">
                            <div class="w-1/2 flex items-center gap-2"><span class="text-[9px] w-6">PG</span><div class="flex-1 h-1.5 bg-gray-800"><div class="h-full ${pgBar}" style="width: ${Math.min(p.pg_load, 100)}%;"></div></div></div>
                            <div class="w-1/2 flex items-center gap-2"><span class="text-[9px] w-6">CPU</span><div class="flex-1 h-1.5 bg-gray-800"><div class="h-full bg-[var(--accent)]" style="width: ${p.cpu_load}%;"></div></div></div>
                        </div>
                    </div>`;
                });
                document.getElementById('setupContent').innerHTML = html;
            }
        }

        async function exportExcel() {
            if(!currentPlan) return;
            let response = await fetch(`${API_BASE}/export`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan_data: currentPlan }) });
            let blob = await response.blob(); let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a'); a.href = url; a.download = "PI_Plan.xlsx"; document.body.appendChild(a); a.click(); a.remove();
        }
        window.onload = init;
    </script>
</body>
</html>
