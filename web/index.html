<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EVE PI Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');
        
        /* CSS ПЕРЕМЕННЫЕ ДЛЯ ТЕМ */
        :root {
            --bg-main: #060a14;
            --bg-panel: rgba(11, 17, 26, 0.75);
            --bg-input: #03050a;
            --border-color: #1a2639;
            --text-main: #8a9bb3;
            --text-heading: #38bdf8;
            --text-white: #ffffff;
            --accent: #38bdf8;
            --accent-hover: rgba(56, 189, 248, 0.05);
            --bg-header: #0b111a;
        }

        .light-theme {
            --bg-main: #f1f5f9;
            --bg-panel: rgba(255, 255, 255, 0.95);
            --bg-input: #f8fafc;
            --border-color: #cbd5e1;
            --text-main: #475569;
            --text-heading: #0284c7;
            --text-white: #0f172a;
            --accent: #0284c7;
            --accent-hover: rgba(2, 132, 199, 0.05);
            --bg-header: #e2e8f0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: background-color 0.3s, color 0.3s;
        }

        .font-mono-eve { font-family: 'Share Tech Mono', monospace; }
        .text-white-dynamic { color: var(--text-white); }
        .bg-header-dynamic { background-color: var(--bg-header); border-color: var(--border-color); }
        .border-dynamic { border-color: var(--border-color); }

        .eve-panel {
            position: relative;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding: 8px 12px;
        }
        .panel-header h2 { color: var(--text-heading); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .eve-input {
            background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-white);
            font-family: 'Share Tech Mono', monospace; font-size: 13px; width: 100%;
            padding: 8px 12px; outline: none; transition: all 0.3s;
        }
        .eve-input:focus { border-color: var(--accent); }

        .eve-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-main);
            width: 100%; padding: 10px; font-weight: 600; display: flex;
            justify-content: space-between; align-items: center; cursor: pointer;
            transition: all 0.2s;
        }
        .eve-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-hover); }

        .status-dot {
            width: 8px; height: 8px; background-color: #4ade80; border-radius: 50%;
            display: inline-block; box-shadow: 0 0 8px #4ade80;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-header-dynamic border-b p-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-3 h-3 rounded-full bg-[#38bdf8]"></div>
            <h1 class="text-lg font-bold text-white-dynamic tracking-widest" data-i18n="title">PI DIRECTOR</h1>
        </div>
        
        <!-- Контролы темы и языка -->
        <div class="flex items-center gap-6 font-mono-eve text-xs">
            <button onclick="toggleTheme()" class="hover:text-[var(--accent)]">[ 🌓 THEME ]</button>
            <button onclick="toggleLang()" class="hover:text-[var(--accent)]" id="langBtn">[ EN / RU ]</button>
            <div class="flex items-center gap-2">
                <span class="status-dot"></span>
                <span class="text-[#4ade80] font-bold tracking-widest">OPERATIONAL</span>
            </div>
        </div>
    </header>

    <div class="flex-1 p-4 grid grid-cols-1 md:grid-cols-12 gap-4">
        
        <!-- LEFT COLUMN -->
        <div class="col-span-3 flex flex-col gap-4">
            
            <div class="eve-panel">
                <div class="panel-header">
                    <h2 data-i18n="access">ДОСТУП</h2>
                </div>
                <div class="p-4" id="authContainer">
                    <button onclick="loginSSO()" class="eve-btn border-[#0f4a73] text-[var(--accent)] mb-3">
                        <span class="flex items-center gap-2" data-i18n="login_btn">ВОЙТИ ЧЕРЕЗ EVE SSO</span>
                    </button>
                </div>
            </div>

            <div class="eve-panel">
                <div class="panel-header">
                    <h2 data-i18n="market">MARKET INTELLIGENCE</h2>
                </div>
                <div class="p-4">
                    <button onclick="analyzeMarket(event)" class="eve-btn mb-3 border-[var(--accent)] text-[var(--accent)]">
                        <span data-i18n="market_btn">АЛГОРИТМ ОЦЕНКИ ВЫГОДЫ</span>
                    </button>
                    <div id="marketResults" class="hidden">
                        <div id="bestProductLabel" class="text-white-dynamic font-bold tracking-wider mb-3 bg-[var(--accent-hover)] p-2 border border-[var(--accent)]"></div>
                        <div id="marketTable" class="space-y-1 max-h-32 overflow-y-auto pr-1"></div>
                    </div>
                </div>
            </div>

            <div class="eve-panel">
                <div class="panel-header"><h2 data-i18n="logistics">ПАРАМЕТРЫ ЛОГИСТИКИ</h2></div>
                <div class="p-4 space-y-4">
                    <div>
                        <label class="block text-[10px] mb-1" data-i18n="region">Домашнее созвездие</label>
                        <select id="baseSelect" class="eve-input">
                            <option value="ALL" data-i18n="all_region">-- ВЕСЬ РЕГИОН --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[var(--accent)] mb-1 font-bold" data-i18n="factory_sys">Система сборки</label>
                        <select id="factorySystem" class="eve-input">
                            <option value="" data-i18n="select_sys">-- ВЫБЕРИТЕ СИСТЕМУ --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] mb-1" data-i18n="target_prod">Целевой продукт</label>
                        <select id="prodSelect" class="eve-input"></select>
                    </div>
                    <button onclick="calculate()" class="eve-btn mt-2">
                        <span data-i18n="gen_plan">СГЕНЕРИРОВАТЬ ПЛАН</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="col-span-9 flex flex-col gap-4">
            <div id="resultBox" class="eve-panel flex-1 flex flex-col">
                <div class="panel-header"><h2 data-i18n="dist">РАСПРЕДЕЛЕНИЕ ПЕРСОНАЖЕЙ</h2></div>
                <div id="setupContent" class="p-4 space-y-2">
                    <div class="flex items-center justify-center py-20 border border-dashed border-dynamic text-sm" data-i18n="waiting">
                        ОЖИДАНИЕ ВВОДА ПАРАМЕТРОВ...
                    </div>
                </div>
                <div class="border-t border-dynamic p-3 flex justify-between items-center bg-[var(--bg-input)] mt-auto">
                    <span class="font-mono-eve text-[10px] text-[#4ade80]" id="logStatus">SYS · READY</span>
                    <button onclick="exportExcel()" class="font-mono-eve text-[11px] hover:text-[var(--accent)] transition-colors px-4 py-1 border border-dynamic" data-i18n="export">
                        [ EXPORT TO EXCEL ]
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentPlan = null;
        let currentLang = 'ru';

        // --- ЛОКАЛИЗАЦИЯ ---
        const dict = {
            ru: {
                title: "PI DIRECTOR", access: "ДОСТУП", login_btn: "ВОЙТИ ЧЕРЕЗ EVE SSO",
                market: "MARKET INTELLIGENCE", market_btn: "АЛГОРИТМ ОЦЕНКИ ВЫГОДЫ",
                logistics: "ПАРАМЕТРЫ ЛОГИСТИКИ", region: "Домашнее созвездие", all_region: "-- ВЕСЬ РЕГИОН --",
                factory_sys: "Система сборки (P2-P4)", select_sys: "-- ВЫБЕРИТЕ СИСТЕМУ --",
                target_prod: "Целевой продукт", gen_plan: "СГЕНЕРИРОВАТЬ ПЛАН",
                dist: "РАСПРЕДЕЛЕНИЕ ПЕРСОНАЖЕЙ", waiting: "ОЖИДАНИЕ ВВОДА ПАРАМЕТРОВ...", export: "[ ЭКСПОРТ В EXCEL ]"
            },
            en: {
                title: "PI DIRECTOR", access: "ACCESS", login_btn: "LOGIN VIA EVE SSO",
                market: "MARKET INTELLIGENCE", market_btn: "PROFITABILITY ALGORITHM",
                logistics: "LOGISTICS PARAMETERS", region: "Home Constellation", all_region: "-- ENTIRE REGION --",
                factory_sys: "Assembly System (P2-P4)", select_sys: "-- SELECT SYSTEM --",
                target_prod: "Target Product", gen_plan: "GENERATE PLAN",
                dist: "CHARACTER DISTRIBUTION", waiting: "AWAITING PARAMETERS...", export: "[ EXPORT TO EXCEL ]"
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(dict[currentLang][key]) {
                    if(el.tagName === 'OPTION') el.text = dict[currentLang][key];
                    else el.innerText = dict[currentLang][key];
                }
            });
            document.getElementById('langBtn').innerText = currentLang === 'ru' ? '[ EN / RU ]' : '[ RU / EN ]';
        }

        // --- ТЕМА ---
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        async function init() {
            checkAuth();
            try {
                let response = await fetch(`${API_BASE}/initial-data`);
                let res = await response.json();
                
                let baseSel = document.getElementById('baseSelect');
                let prodSel = document.getElementById('prodSelect');
                
                res.bases.forEach(b => baseSel.innerHTML += `<option value="${b}">${b}</option>`);
                res.products.forEach(p => prodSel.innerHTML += `<option value="${p}">${p}</option>`);
                
                baseSel.addEventListener('change', async (e) => {
                    let sysSel = document.getElementById('factorySystem');
                    sysSel.innerHTML = `<option value="">${dict[currentLang]['select_sys']}</option>`;
                    let sysRes = await fetch(`${API_BASE}/systems/${e.target.value}`);
                    let sysData = await sysRes.json();
                    sysData.systems.forEach(s => sysSel.innerHTML += `<option value="${s}">${s}</option>`);
                });

                // Имитируем клик по селектору при загрузке, чтобы подтянуть все системы региона
                baseSel.dispatchEvent(new Event('change'));

            } catch (error) { console.error(error); }
        }

        // ... (Функции checkAuth, loginSSO, logoutSSO и renderAuthUser остались без изменений, 
        // просто добавлены стили text-white-dynamic вместо жесткого белого)
        
        function checkAuth() {
            let token = localStorage.getItem('eve_token');
            if (token) renderAuthUser();
        }

        async function loginSSO() {
            let logRes = await fetch(`${API_BASE}/auth/login`);
            let callRes = await fetch(`${API_BASE}/auth/callback?code=mock_code`);
            let authData = await callRes.json();
            if(authData.status === "success") {
                localStorage.setItem('eve_token', 'mock_jwt');
                localStorage.setItem('eve_chars', JSON.stringify(authData.characters));
                renderAuthUser();
            }
        }

        function renderAuthUser() {
            let charsStr = localStorage.getItem('eve_chars');
            if(!charsStr) return;
            let chars = JSON.parse(charsStr);
            let container = document.getElementById('authContainer');
            let html = `<div class="space-y-1 max-h-32 overflow-y-auto pr-1">`;
            chars.forEach(c => {
                let roleColor = c.ccu === 5 ? "text-[var(--accent)]" : "text-[var(--text-main)]";
                html += `
                <div class="flex justify-between items-center bg-[var(--bg-input)] border border-dynamic p-2">
                    <span class="text-white-dynamic font-bold text-[11px]">${c.name}</span>
                    <span class="${roleColor} text-[10px] font-mono-eve">${c.ccu === 5 ? 'FACTORY' : 'MINING'}</span>
                </div>`;
            });
            html += `</div><button onclick="logoutSSO()" class="mt-4 font-mono-eve text-[10px] text-[#ef4444] w-full text-right">[ LOGOUT ]</button>`;
            container.innerHTML = html;
        }
        function logoutSSO() { localStorage.clear(); location.reload(); }

        async function analyzeMarket(event) {
            let btn = event.currentTarget; let original = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">SYNCING...</span>';
            try {
                let response = await fetch(`${API_BASE}/market/best-product`);
                let res = await response.json();
                if(res.status === "success") {
                    document.getElementById('marketResults').classList.remove('hidden');
                    document.getElementById('bestProductLabel').innerText = res.recommended.toUpperCase();
                    document.getElementById('prodSelect').value = res.recommended;
                    
                    let html = '';
                    res.analytics.forEach((item, i) => {
                        html += `<div class="flex justify-between text-[11px] font-mono-eve border-b border-dynamic pb-1">
                            <span class="${i === 0 ? 'text-[#4ade80]' : ''}">${item.product}</span>
                            <span class="text-white-dynamic">${item.jita_buy.toLocaleString('ru-RU')} ISK</span>
                        </div>`;
                    });
                    document.getElementById('marketTable').innerHTML = html;
                }
            } catch (error) {} finally { btn.innerHTML = original; }
        }

        async function calculate() {
            let base = document.getElementById('baseSelect').value;
            let sys = document.getElementById('factorySystem').value;
            let prod = document.getElementById('prodSelect').value;
            if(!sys) return alert("Select assembly system / Выберите систему");
            
            document.getElementById('setupContent').innerHTML = '<div class="text-[var(--accent)] p-4 font-mono-eve animate-pulse">CALCULATING...</div>';
            
            let response = await fetch(`${API_BASE}/calculate`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ constellation: base, factory_sys: sys, target_product: prod })
            });
            let res = await response.json();
            
            if(res.status === "success") {
                currentPlan = res.data;
                let html = '';
                res.data.forEach(p => {
                    let pgBar = p.pg_load > 100 ? "bg-[#ef4444]" : "bg-[#f59e0b]";
                    html += `
                    <div class="bg-[var(--bg-input)] border ${p.pg_load > 100 ? 'border-[#ef4444]' : 'border-dynamic'} p-3 flex flex-col gap-2 mb-2">
                        <div class="flex justify-between items-start">
                            <div class="w-1/3"><span class="text-white-dynamic font-bold">${p.character}</span><br><span class="text-[10px]">${p.role}</span></div>
                            <div class="w-1/3 text-center text-[11px]">${p.system}<br><span class="text-[9px] text-[var(--accent)]">${p.planet}</span></div>
                            <div class="w-1/3 text-right font-mono-eve text-[10px]">IN: ${p.res_in}<br>OUT: <span class="font-bold text-[var(--accent)]">${p.res_out}</span></div>
                        </div>
                        <div class="flex gap-4 items-center bg-[var(--bg-panel)] p-1 border border-dynamic">
                            <div class="w-1/2 flex items-center gap-2"><span class="text-[9px] w-6">PG</span>
                            <div class="flex-1 h-1.5 bg-gray-800"><div class="h-full ${pgBar}" style="width: ${Math.min(p.pg_load, 100)}%;"></div></div></div>
                            <div class="w-1/2 flex items-center gap-2"><span class="text-[9px] w-6">CPU</span>
                            <div class="flex-1 h-1.5 bg-gray-800"><div class="h-full bg-[var(--accent)]" style="width: ${p.cpu_load}%;"></div></div></div>
                        </div>
                    </div>`;
                });
                document.getElementById('setupContent').innerHTML = html;
            }
        }

        async function exportExcel() {
            if(!currentPlan) return;
            let response = await fetch(`${API_BASE}/export`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plan_data: currentPlan })
            });
            let blob = await response.blob();
            let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a'); a.href = url; a.download = "PI_Plan.xlsx";
            document.body.appendChild(a); a.click(); a.remove();
        }
        window.onload = init;
    </script>
</body>
</html>
