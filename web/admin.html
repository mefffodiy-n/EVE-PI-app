<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PI Director — admin</title>
<style>
  :root { --void:#0b0d10; --panel:#12151a; --seam:#2a2f37; --dim:#8a8f98; --text:#e8e8ea; --amber:#e8a33d; }
  body { background:var(--void); color:var(--text); font-family:'Segoe UI',Arial,sans-serif; font-size:13px; margin:0; padding:20px; }
  h1 { font-size:16px; margin:0 0 16px; }
  h2 { font-size:13px; margin:24px 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  table { border-collapse:collapse; width:100%; margin-bottom:16px; }
  th, td { border:1px solid var(--seam); padding:4px 8px; text-align:left; font-size:12px; }
  th { color:var(--dim); font-weight:normal; }
  input, select, button { background:var(--panel); color:var(--text); border:1px solid var(--seam); padding:3px 6px; font-size:12px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--amber); color:var(--amber); }
  .status-ready { color:#6cbf6c; }
  .status-no_data { color:var(--dim); }
  .msg { padding:6px 10px; margin-bottom:10px; border:1px solid var(--seam); }
  .msg.bad { border-color:#d15b5b; color:#d15b5b; }
  .msg.ok { border-color:#6cbf6c; color:#6cbf6c; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .density-cell input { width:70px; }
</style>
</head>
<body>
<h1>PI Director — плотность сырья по регионам (admin)</h1>
<div id="messages"></div>

<h2>Регионы</h2>
<table id="regionsTable">
  <thead><tr><th>Регион</th><th>Статус</th><th>Планет</th><th></th></tr></thead>
  <tbody id="regionsBody"></tbody>
</table>

<div id="regionDetail" style="display:none">
  <h2 id="regionTitle"></h2>
  <div class="row">
    <button onclick="downloadTemplate()">Скачать CSV-шаблон</button>
    <input type="file" id="uploadFile" accept=".csv">
    <button onclick="uploadTemplate()">Загрузить CSV</button>
    <button onclick="markReady()">Готово (сделать регион ready)</button>
  </div>
  <table id="planetsTable">
    <thead><tr><th>Система</th><th>№</th><th>Тип</th><th>Радиус, км</th><th>POCO %</th><th>Владелец</th></tr></thead>
    <tbody id="planetsBody"></tbody>
  </table>
</div>

<script>
const API = '/api/admin';
let currentRegionId = null;

function msg(text, bad) {
  document.getElementById('messages').innerHTML =
    `<div class="msg ${bad ? 'bad' : 'ok'}">${text}</div>`;
}

async function loadRegions() {
  const r = await fetch(`${API}/regions`);
  if (r.status === 404) {
    document.body.innerHTML = '<h1>Не найдено</h1>';
    return;
  }
  const d = await r.json();
  const body = document.getElementById('regionsBody');
  body.innerHTML = (d.regions || []).map(reg => `
    <tr>
      <td>${reg.name}</td>
      <td class="status-${reg.status}">${reg.status}</td>
      <td>${reg.planet_count}</td>
      <td><button onclick="openRegion(${reg.id}, '${reg.name}')">Открыть</button></td>
    </tr>`).join('');
}

async function openRegion(id, name) {
  currentRegionId = id;
  document.getElementById('regionDetail').style.display = '';
  document.getElementById('regionTitle').textContent = name;
  await loadPlanets();
}

async function loadPlanets() {
  const r = await fetch(`${API}/regions/${currentRegionId}/planets`);
  const d = await r.json();
  const body = document.getElementById('planetsBody');
  body.innerHTML = (d.planets || []).map(p => `
    <tr>
      <td>${p.system}</td><td>${p.planet_number}</td><td>${p.planet_type}</td>
      <td>${p.radius_km ?? ''}</td>
      <td><input type="number" step="0.1" value="${p.poco_tax_rate ?? ''}"
          onchange="patchPlanet(${p.id}, 'poco_tax_rate', this.value ? parseFloat(this.value) : null)"></td>
      <td><input type="text" value="${p.poco_owner ?? ''}"
          onchange="patchPlanet(${p.id}, 'poco_owner', this.value || null)"></td>
    </tr>`).join('');
}

async function patchPlanet(id, field, value) {
  const r = await fetch(`${API}/planets/${id}`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({[field]: value}),
  });
  const d = await r.json();
  msg(d.status === 'success' ? 'Сохранено' : (d.message || 'Ошибка'), d.status !== 'success');
}

function downloadTemplate() {
  window.location = `${API}/regions/${currentRegionId}/template.csv`;
}

async function uploadTemplate() {
  const input = document.getElementById('uploadFile');
  if (!input.files.length) { msg('Выберите файл', true); return; }
  const form = new FormData();
  form.append('file', input.files[0]);
  const r = await fetch(`${API}/regions/${currentRegionId}/upload`, {method: 'POST', body: form});
  const d = await r.json();
  if (d.status !== 'success') { msg(d.message || 'Ошибка загрузки', true); return; }
  const unmatchedNote = d.unmatched.length
    ? ` Не найдено в этом регионе: ${d.unmatched.map(u => `${u.system} ${u.planet}`).join(', ')}.`
    : '';
  msg(`Обновлено планет: ${d.updated}.${unmatchedNote}`, d.unmatched.length > 0);
  await loadPlanets();
}

async function markReady() {
  const r = await fetch(`${API}/regions/${currentRegionId}/ready`, {method: 'POST'});
  const d = await r.json();
  if (d.status !== 'success') { msg(d.message || 'Ошибка', true); return; }
  msg('Регион переключён в ready');
  await loadRegions();
}

loadRegions();
</script>
</body>
</html>
